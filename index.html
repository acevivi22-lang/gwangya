<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광야 수련 일지</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="광야">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 밤의 광야 — 상단 수도자 카드(레벨·XP), 아래 퀘스트 목록, 하단 탭(오늘·집중·성장·기록). 다크 단일 테마 */
:root{
  color-scheme:dark;
  --bg:#0e0e0c; --surface:#191916; --surface2:#23221e; --line:#302f29;
  --ink:#eee8da; --muted:#8e897c; --bone:#e9e0cc; --bone-ink:#16150f;
  --ember:#ec8a2f; --ember-soft:#3a2412;
  --s-wis:#a395ff; --s-spi:#5fd1b8; --s-str:#f0604f; --s-dis:#6fb1ff;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.screen{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.note{font-size:.8rem;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:2.4rem;margin:8px 0 0;line-height:1.1}

/* hero */
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:230px;border:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .in{position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(90deg,rgba(10,10,8,.82) 0%,rgba(10,10,8,.45) 55%,rgba(10,10,8,0) 100%);min-height:230px}
.rank{font-family:var(--f-display);font-size:1.5rem;color:var(--bone);line-height:1.1}
.lvrow{display:flex;align-items:flex-end;gap:8px}
.lvtag{font-family:var(--f-display);color:var(--ember);font-size:1.4rem;line-height:1;padding-bottom:12px}
.lv{font-family:var(--f-display);font-size:5.2rem;line-height:.9;color:var(--bone);text-shadow:4px 4px 0 var(--ember)}
.xpbar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:300px}
.xpbar i{height:12px;background:rgba(255,255,255,.12);transform:skewX(-14deg)}
.xpbar i.on{background:var(--ember)}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--bone)}
.flame{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:1.05rem;color:var(--ember)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:340px;margin-top:4px}
.mini{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini b{font-family:var(--f-display);font-weight:400;font-size:.95rem;display:flex;gap:4px;align-items:baseline}
.mini b small{font-family:var(--f-body);font-size:.68rem;color:var(--muted)}
.mini i{display:block;height:5px;border-radius:1px;background:rgba(255,255,255,.12);overflow:hidden}
.mini i u{display:block;height:100%}

/* date nav + segment */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav .d{font-weight:700;text-align:center;flex:1}
.datenav .d small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.iconbtn:disabled{opacity:.3;cursor:default}
.seg{display:flex;gap:6px;align-items:stretch}
.seg button{flex:1;border:2px solid var(--line);background:transparent;border-radius:4px;padding:8px 6px;cursor:pointer;font-weight:900;color:var(--muted);font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--bone);color:var(--bone-ink);border-color:var(--bone)}
.seg .add{flex:0 0 48px;font-size:1.4rem;font-weight:400;color:var(--ink)}

/* quest cards */
.quests{display:flex;flex-direction:column;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.q.done{background:linear-gradient(90deg,var(--ember-soft),var(--surface) 70%)}
.qhead{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px;cursor:pointer}
.qicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.qname{font-family:var(--f-display);font-size:1.35rem;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted);margin-top:3px}
.qmeta .sep{opacity:.4}
.qmeta .prog{font-family:var(--f-display);color:var(--ink);font-size:.9rem;font-variant-numeric:tabular-nums}
.bars{display:inline-flex;gap:2px;align-items:flex-end}
.bars i{width:3px;background:var(--muted);opacity:.35}
.bars i.on{opacity:1;background:var(--ink)}
.check{width:46px;height:46px;border:2px solid var(--muted);background:transparent;border-radius:3px;cursor:pointer;display:grid;place-items:center;padding:0}
.check.on{background:var(--ember);border-color:var(--ember);color:var(--bone-ink)}
.qbody{padding:0 14px 14px 66px;display:flex;flex-direction:column;gap:10px}
.qbody .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.pill.ghost{background:transparent}
.pill.hot{background:var(--ember);border-color:var(--ember);color:var(--bone-ink);font-weight:700}
input[type=number],input[type=time],input[type=date],input[type=text],select{font:500 1rem var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=number]{width:6em;text-align:right}
textarea{font:inherit;width:100%;min-height:84px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:10px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.nav .bar{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:420px;background:rgba(28,28,25,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px}
.nav button{border:none;background:transparent;border-radius:999px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}

/* chips & panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{background:var(--bone);color:var(--bone-ink);border-color:var(--bone)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:transparent;border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt b{font-weight:700}
.opt small{color:var(--muted);font-size:.75rem}
.opt[aria-pressed="true"]{border-color:var(--bone);background:var(--surface2)}
.big{width:100%;border:none;border-radius:999px;padding:16px;background:var(--bone);color:var(--bone-ink);font-weight:900;font-size:1.05rem;cursor:pointer}

/* stats */
.stats{display:flex;flex-direction:column}
.stat{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.stat .n{font-family:var(--f-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .d{font-size:.8rem;color:var(--muted)}
.lvcard{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.lvcard .n{font-family:var(--f-display);font-size:3.4rem;line-height:1}
.lvcard .x{font-family:var(--f-display);font-size:2rem;text-align:right;line-height:1}
.segbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.segbar i{height:16px;background:var(--surface2)}
.segbar i.on{background:var(--ember)}

/* achievements */
.achgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:440px){.achgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ach{aspect-ratio:1;max-width:100%;border-radius:8px;border:2px dashed var(--line);background:var(--surface);cursor:pointer;padding:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-size:1.8rem}
.ach.on{border:2px solid #000;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.ach canvas{width:100%;height:100%;display:block}

/* day grid */
.dgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.cell{aspect-ratio:1;max-width:100%;border:none;border-radius:4px;background:var(--surface2);font:.68rem var(--f-display);color:var(--muted);cursor:pointer;position:relative;padding:0}
.cell[data-l="1"]{background:#4a3018}
.cell[data-l="2"]{background:#8a5420;color:var(--bone)}
.cell[data-l="3"]{background:var(--ember);color:var(--bone-ink)}
.cell.future{opacity:.4}
.cell.today{outline:2px solid var(--bone);outline-offset:1px}
.cell.mile::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--bone)}
.form{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 14px;cursor:pointer}

/* toast */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);width:min(420px,calc(100% - 24px));background:var(--bone);color:var(--bone-ink);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:60;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:translate(-50%,0)}
.toast .t1{padding:12px 16px 6px}
.toast .t1 small{font-size:.75rem;opacity:.7}
.toast .t1 b{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:400;font-size:2.2rem;line-height:1.1}
.toast .t2{display:flex;justify-content:space-between;border-top:1px solid rgba(0,0,0,.12);padding:8px 16px;font-size:.9rem;font-weight:700}
.up{color:#2f9e55}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,6,5,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.ovcard{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ovcard h3{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;color:var(--bone)}
.ovart{width:min(300px,80vw);aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid #000;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ovart canvas{width:100%;height:100%;display:block}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:1rem;line-height:1.7;width:100%}
.quote small{display:block;color:var(--muted);font-size:.8rem;margin-top:8px}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.sheet{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
.sheet .f{display:flex;flex-direction:column;gap:6px}
.sheet .f input[type=text]{width:100%}
.danger{color:#f0604f}
.lvup .lv{font-size:8rem}

/* run view */
.run{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 30%,#2a1d10 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px))}
.ring{position:relative;width:min(320px,80vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .time{font-family:var(--f-display);font-size:clamp(3.4rem,17vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
.runbtns{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;width:min(420px,100%);align-items:center}
.circ{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;font-size:.8rem;display:grid;place-items:center;padding:0}
.wide{height:56px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700;font-size:1rem}
.orb{width:min(300px,72vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#5fd1b8 0%,rgba(95,209,184,.35) 45%,rgba(95,209,184,.08) 70%);display:grid;place-items:center;transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.orb span{font-family:var(--f-display);font-size:2.4rem;color:var(--ink);transform:scale(1.4)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.orb{transition:none!important}}

body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div class="bar" id="nav"></div></nav>
<div class="toast" id="toast" aria-live="polite"></div>
<div id="ovroot"></div>
<div id="runroot"></div>

<script>
/* ======================= 기본 설정 ======================= */
const KEY="wildernessLog.v1";
const STATS={
  wis:{n:"지혜",c:"var(--s-wis)",ic:'<path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3Z"/><path d="M9 22h6"/>'},
  spi:{n:"영성",c:"var(--s-spi)",ic:'<path d="M12 2v6M9 5h6"/><path d="M5 22c0-6 3-10 7-10s7 4 7 10"/>'},
  str:{n:"힘",c:"var(--s-str)",ic:'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>'},
  dis:{n:"절제",c:"var(--s-dis)",ic:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'}
};
const DIFF={easy:{n:"쉽다",xp:15,b:1},mid:{n:"보통",xp:25,b:2},hard:{n:"어렵다",xp:40,b:3}};
const RANKS=[[1,"광야의 입문자"],[5,"광야의 순례자"],[10,"은수자"],[15,"수도자"],[20,"고행자"],[25,"광야의 현자"],[30,"사막의 교부"]];
const DEF_START="2026-10-06", DEF_TOTAL=66;

/* ======================= 날짜 ======================= */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>iso(new Date());
const W="일월화수목금토";
const fmtKo=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]})`};

/* ======================= 저장 + 이전 버전 변환 ======================= */
function defaultQuests(g){
  g=g||{};
  return [
    {id:"wake",name:"기상",type:"time",base:g.wake||"05:30",unit:"",inc:0,stat:"dis",diff:"mid",created:"2000-01-01"},
    {id:"meditate",name:"명상",type:"amount",base:g.meditate??30,unit:"분",inc:0,stat:"spi",diff:"easy",created:"2000-01-01"},
    {id:"bible",name:"성경 읽기",type:"amount",base:g.bible??60,unit:"분",inc:0,stat:"spi",diff:"mid",created:"2000-01-01"},
    {id:"study",name:"공부",type:"amount",base:g.study??6,unit:"시간",inc:0,stat:"wis",diff:"hard",created:"2000-01-01"},
    {id:"workout",name:"운동",type:"check",base:1,unit:"",inc:0,stat:"str",diff:"hard",created:"2000-01-01"},
    {id:"diet",name:"식단 지키기",type:"check",base:1,unit:"",inc:0,stat:"dis",diff:"mid",created:"2000-01-01"}
  ];
}
function migrate(o){
  o=o||{};
  o.start=o.start||DEF_START; o.total=o.total||DEF_TOTAL;
  if(!o.quests){o.quests=defaultQuests(o.goals);delete o.goals}
  const days={};
  for(const [k,v] of Object.entries(o.days||{})){
    if(/^\d+$/.test(k))days[addDays(DEF_START,+k-1)]=v; else days[k]=v;
  }
  o.days=days; o.sessions=o.sessions||[]; o.ach=o.ach||{}; o.run=o.run||null; o.v=2;
  return o;
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
let db=migrate(load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
save();

/* ======================= 계산 ======================= */
const idxOf=s=>diffDays(db.start,s)+1;
const dateOfIdx=i=>addDays(db.start,i-1);
const lastDate=()=>dateOfIdx(db.total);
const miles=()=>[...new Set([40,db.total].filter(n=>n<=db.total))];
function target(q,d){
  if(q.type==="time")return q.base;
  if(q.type==="check")return 1;
  const w=Math.max(0,Math.floor((idxOf(d)-1)/7));
  let t=+q.base+(+q.inc||0)*w;
  return Math.round(t*10)/10;
}
function isDone(q,d,day){
  day=day||db.days[d]||{};const v=day[q.id];
  if(v===undefined||v===""||v===null)return false;
  if(q.type==="check")return !!v;
  if(q.type==="time")return v<=q.base;
  const t=target(q,d);return t>0&&+v>=t;
}
const isSkipped=(q,d)=>((db.days[d]||{})._skip||[]).includes(q.id);
const visibleQuests=d=>db.quests.filter(q=>!q.archived&&q.created<=d);
function toMin(q,v){v=+v||0;return q.unit==="시간"?v*60:q.unit==="분"?v:0}
function levelInfo(xp){let L=1,need=100;while(xp>=need){xp-=need;L++;need=100+20*(L-1)}return {L,into:xp,need}}
const rankOf=L=>RANKS.filter(r=>L>=r[0]).pop()[1];
const statVal=x=>Math.floor(x/10);

function compute(upto){
  const lim=upto||today();
  const a={xp:0,st:{wis:0,spi:0,str:0,dis:0},done:0,perfect:new Set(),recorded:0,wisMin:0,spiMin:0,medMin:0,bibleMin:0,workouts:0,early:0,memo:0,focus:0,breath:0,maxSingle:0};
  const dates=Object.keys(db.days).filter(d=>d<=lim).sort();
  for(const d of dates){
    const day=db.days[d];let any=false,hasStr=false;
    if(day.memo&&day.memo.trim())a.memo++;
    for(const q of db.quests){
      const v=day[q.id];
      if(v!==undefined&&v!==""&&v!==null)any=true;
      if(q.type==="amount"){const m=toMin(q,v);if(q.stat==="wis")a.wisMin+=m;if(q.stat==="spi")a.spiMin+=m;if(q.id==="meditate")a.medMin+=m;if(q.id==="bible")a.bibleMin+=m}
      if(isDone(q,d,day)){
        const x=DIFF[q.diff].xp;a.xp+=x;a.st[q.stat]+=x;a.done++;
        if(q.stat==="str")hasStr=true;
        if(q.type==="time")a.early++;
      }
    }
    if(hasStr)a.workouts++;
    if(any)a.recorded++;
    const vis=visibleQuests(d).filter(q=>!isSkipped(q,d));
    if(vis.length&&vis.every(q=>isDone(q,d,day)))a.perfect.add(d);
  }
  for(const s of db.sessions){if(s.d>lim)continue;if(s.kind==="focus")a.focus++;else{a.breath++;a.spiMin+=0}}
  // 연속 완수
  let streak=0,cur=lim;
  if(!a.perfect.has(cur))cur=addDays(cur,-1);
  while(a.perfect.has(cur)){streak++;cur=addDays(cur,-1)}
  let best=0,run=0,prev=null;
  for(const d of [...a.perfect].sort()){run=(prev&&diffDays(prev,d)===1)?run+1:1;best=Math.max(best,run);prev=d}
  a.streak=streak;a.best=best;a.lv=levelInfo(a.xp);
  return a;
}

function rng(seed){let a=seed*2654435761>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAL={
  dawn:{sky:["#24264a","#c96f6a","#f3c48c"],sun:"#ffe7b3",m:["#5a4660","#352b42","#1b1624"]},
  dusk:{sky:["#16142c","#5d3159","#e3874c"],sun:"#ffcf7a",m:["#3e2a3c","#261b29","#130e16"]},
  night:{sky:["#04060d","#0d1830","#24385c"],sun:"#eef2ff",m:["#18233c","#0f1729","#070b14"],stars:1,moon:1},
  desert:{sky:["#2e2240","#b8653f","#f1b46a"],sun:"#fff1c9",m:["#a8673d","#7a4529","#43230f"],dunes:1},
  storm:{sky:["#0a1216","#1d3842","#4a737c"],sun:null,m:["#1b2b31","#10191d","#070c0e"],sea:1},
  forest:{sky:["#0d1d18","#2d5843","#a4cb8e"],sun:"#f7f2c4",m:["#24443a","#152a22","#0a1611"]},
  ember:{sky:["#110706","#5c1a0e","#e8692b"],sun:"#ffd480",m:["#2c100a","#1b0906","#0b0403"]}
};
function drawArt(cv,seed,theme,opt){
  opt=opt||{};const r=rng(seed),P=PAL[theme]||PAL.dusk;
  const w=cv.width,h=cv.height,g=cv.getContext("2d");
  const hz=h*(opt.hz||.62);
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,P.sky[0]);gr.addColorStop(.6,P.sky[1]);gr.addColorStop(1,P.sky[2]);
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  if(P.stars){for(let i=0;i<w*h/2600;i++){g.globalAlpha=.3+r()*.7;g.fillStyle="#fff";const s=r()*1.6*w/300+.3;g.fillRect(r()*w,r()*hz*.9,s,s)}g.globalAlpha=1}
  if(theme==="storm"){g.strokeStyle="rgba(255,255,255,.07)";g.lineWidth=w/200;for(let i=0;i<40;i++){const x=r()*w,y=r()*hz;g.beginPath();g.moveTo(x,y);g.lineTo(x-w*.02,y+h*.06);g.stroke()}}
  if(P.sun){
    const sx=w*(opt.sx??(.3+r()*.4)),sy=hz*(opt.sy??(.35+r()*.35)),sr=w*(P.moon?.06:.1);
    const glow=g.createRadialGradient(sx,sy,0,sx,sy,sr*4);glow.addColorStop(0,P.sun+"aa");glow.addColorStop(1,P.sun+"00");
    g.fillStyle=glow;g.fillRect(0,0,w,h);g.fillStyle=P.sun;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
    if(P.moon){g.fillStyle=P.sky[1];g.beginPath();g.arc(sx+sr*.45,sy-sr*.2,sr*.85,0,7);g.fill()}
  }
  // 산/사구 3겹
  let peak={x:w*.5,y:hz};
  P.m.forEach((col,li)=>{
    const base=hz+(li*h*.09)-(2-li)*h*.06, amp=h*(P.dunes?.05:.16-li*.03);
    const ph=[r()*6,r()*6,r()*6],fr=[1+r()*1.5,2.5+r()*2,6+r()*4];
    g.fillStyle=col;g.beginPath();g.moveTo(0,h);
    const pts=[];
    for(let x=0;x<=w;x+=w/80){
      const t=x/w;let y=Math.sin(t*fr[0]*3.14+ph[0])*.6+Math.sin(t*fr[1]*3.14+ph[1])*.3+(P.dunes?0:Math.abs(Math.sin(t*fr[2]*3.14+ph[2]))*.25);
      y=base-amp*y;pts.push([x,y]);g.lineTo(x,y);
    }
    g.lineTo(w,h);g.closePath();g.fill();
    if(li===1&&opt.figure!==false){const fx=opt.fx||[.3,.7];const mid=pts.slice(pts.length*fx[0]|0,pts.length*fx[1]|0);peak=mid.reduce((a,p)=>p[1]<a[1]?p:a,mid[0]);peak={x:peak[0],y:peak[1]}}
  });
  if(P.sea){g.strokeStyle="rgba(200,230,240,.25)";g.lineWidth=w/220;for(let i=0;i<14;i++){const y=hz+h*.05+i*h*.025;g.beginPath();for(let x=0;x<=w;x+=w/40)g.lineTo(x,y+Math.sin(x/w*20+i)*h*.006);g.stroke()}}
  if(opt.figure!==false){
    const s=h*(opt.fs||.075),x=peak.x,y=peak.y+1;
    g.fillStyle="#050404";
    g.beginPath();g.moveTo(x-s*.28,y);g.lineTo(x-s*.14,y-s*.78);g.lineTo(x+s*.14,y-s*.78);g.lineTo(x+s*.3,y);g.closePath();g.fill();
    g.beginPath();g.arc(x,y-s*.9,s*.16,0,7);g.fill();
    g.fillRect(x+s*.32,y-s*1.15,s*.05,s*1.15);
  }
  // 필름 비네트
  const v=g.createRadialGradient(w/2,h/2,w*.3,w/2,h/2,w*.8);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.45)");g.fillStyle=v;g.fillRect(0,0,w,h);
}

      <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">

/* ======================= 소리 (Web Audio로 직접 생성) ======================= */
let AC=null,soundNodes=[],crackleT=null,muted=false;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==="suspended")AC.resume();return AC}
function noiseBuf(ctx,kind){
  const len=ctx.sampleRate*3,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
  let last=0,b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;
    if(kind==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.5}
    else if(kind==="pink"){b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.2}
    else d[i]=w;}
  return b;
}
function stopSound(){soundNodes.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(e){}});soundNodes=[];clearInterval(crackleT);crackleT=null}
function playSound(kind){
  stopSound();if(kind==="none"||muted)return;const c=ac();if(!c)return;
  const master=c.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(1,c.currentTime+1.5);master.connect(c.destination);soundNodes.push(master);
  const src=(k)=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,k);s.loop=true;s.start();soundNodes.push(s);return s};
  if(kind==="rain"){
    const s=src("pink"),hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=400;
    const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;const g=c.createGain();g.gain.value=.55;
    s.connect(hp).connect(lp).connect(g).connect(master);
  }else if(kind==="wind"){
    const s=src("brown"),lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;lp.Q.value=4;
    const g=c.createGain();g.gain.value=.5;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.08;lg.gain.value=250;
    lfo.connect(lg).connect(lp.frequency);lfo.start();soundNodes.push(lfo);s.connect(lp).connect(g).connect(master);
  }else if(kind==="fire"){
    const s=src("brown"),lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=300;const g=c.createGain();g.gain.value=.6;s.connect(lp).connect(g).connect(master);
    const wb=noiseBuf(c,"white");
    crackleT=setInterval(()=>{if(!AC)return;const n=1+Math.random()*3|0;for(let i=0;i<n;i++){const t=c.currentTime+Math.random()*.3;
      const b=c.createBufferSource();b.buffer=wb;const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1500+Math.random()*3000;bp.Q.value=3;
      const eg=c.createGain();eg.gain.setValueAtTime(0,t);eg.gain.linearRampToValueAtTime(.3+Math.random()*.5,t+.002);eg.gain.exponentialRampToValueAtTime(.001,t+.03+Math.random()*.05);
      b.connect(bp).connect(eg).connect(master);b.start(t,Math.random()*2,.12)}},180);
  }
}
function bell(){const c=ac();if(!c||muted)return;[528,792,1056].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="sine";const t=c.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25/(i+1),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.5);o.connect(g).connect(c.destination);o.start(t);o.stop(t+3.6)})}
let wakeLock=null;
async function lockScreen(on){try{if(on&&navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}else if(!on&&wakeLock){wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}}

/* ======================= 타이머 (시각 기준이라 앱을 나갔다 와도 정확) ======================= */
let tickT=null;
function creditMinutes(qid,min,date){
  const q=db.quests.find(x=>x.id===qid);if(!q||min<=0)return;
  const add=q.unit==="시간"?Math.round(min/60*100)/100:Math.round(min);
  const cur=+((db.days[date]||{})[qid])||0;setV(date,qid,Math.round((cur+add)*100)/100);
}
function startFocus(){
  const q=db.quests.find(x=>x.id===focus.quest);
  db.run={kind:"focus",phase:"work",total:focus.min*60,endAt:Date.now()+focus.min*60*1000,paused:null,quest:q?.id||"",date:today(),rest:focus.rest,sound:focus.sound};
  save();playSound(focus.sound);lockScreen(true);renderRun();
}
const PATS={box:[["들이마시기",4,1],["멈추기",4,1],["내쉬기",4,.55],["멈추기",4,.55]],"478":[["들이마시기",4,1],["멈추기",7,1],["내쉬기",8,.55]],deep:[["들이마시기",5,1],["내쉬기",5,.55]],calm:[["들이마시기",4,1],["내쉬기",6,.55]]};
function startBreath(){
  db.run={kind:"breath",total:breath.min*60,endAt:Date.now()+breath.min*60*1000,startAt:Date.now(),paused:null,pat:breath.pat,quest:db.quests.find(q=>q.id==="meditate"&&!q.archived)?"meditate":"",date:today()};
  save();ac();lockScreen(true);renderRun();
}
const left=()=>{const r=db.run;if(!r)return 0;return r.paused!=null?r.paused:Math.max(0,(r.endAt-Date.now())/1000)};
const mmss=s=>{s=Math.ceil(s);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
function renderRun(){
  const r=db.run,root=$("#runroot");
  if(!r){root.innerHTML="";clearInterval(tickT);tickT=null;return}
  const q=db.quests.find(x=>x.id===r.quest);
  if(r.kind==="focus"){
    const C=2*Math.PI*46;
    root.innerHTML=`<div class="run"><div class="label">${r.phase==="work"?"포커싱":"휴식"}</div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,.12)" stroke-width="2" fill="none"/><circle id="arc" cx="50" cy="50" r="46" stroke="${r.phase==="work"?"var(--bone)":"var(--s-spi)"}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
        <div class="c"><div class="time" id="rt">${mmss(left())}</div><div class="note">${mmss(r.total)}의</div><div style="font-family:var(--f-display);font-size:1.4rem">${r.phase==="work"?esc(q?.name||"집중"):"숨 돌리기"}</div></div></div>
      <div class="runbtns"><button class="circ" data-rend>끝</button><button class="wide" data-rpause>${r.paused!=null?"계속":"일시정지"}</button><button class="circ" data-rmute aria-label="소리">${svg(muted?ICON.mute:ICON.sound,22)}</button></div></div>`;
  }else{
    root.innerHTML=`<div class="run" style="background:radial-gradient(ellipse at 50% 40%,#123a33 0%,var(--bg) 70%)"><div class="label">호흡 수련</div>
      <div class="orb" id="orb"><span id="phase">준비</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%"><div class="note" id="rt">${mmss(left())} 남음</div>
      <div class="runbtns"><button class="circ" data-rend>끝</button><button class="wide" data-rpause>${r.paused!=null?"계속":"일시정지"}</button><span></span></div></div></div>`;
  }
  clearInterval(tickT);tickT=setInterval(tick,250);tick();
}
let lastPhase=-1;
function tick(){
  const r=db.run;if(!r)return;
  const l=left(),rt=$("#rt");
  if(r.kind==="focus"){
    if(rt)rt.textContent=mmss(l);
    const arc=$("#arc");if(arc){const C=2*Math.PI*46;arc.setAttribute("stroke-dashoffset",String(C*(1-l/r.total)))}
    if(l<=0&&r.paused==null)finishFocus(true);
  }else{
    if(rt)rt.textContent=mmss(l)+" 남음";
    const P=PATS[r.pat],cyc=P.reduce((a,p)=>a+p[1],0);
    const el=r.total-l;let t=el%cyc,i=0;while(t>=P[i][1]){t-=P[i][1];i++}
    const key=Math.floor(el/cyc)*10+i;
    if(key!==lastPhase&&r.paused==null){lastPhase=key;const orb=$("#orb");if(orb){orb.style.transitionDuration=P[i][1]+"s";orb.style.transform=`scale(${P[i][2]})`;$("#phase").textContent=P[i][0]}}
    if(l<=0&&r.paused==null)finishBreath(true);
  }
}
function finishFocus(natural){
  const r=db.run;if(!r)return;
  if(r.phase==="work"){
    const min=Math.round((r.total-left())/60);
    if(min>=1){creditMinutes(r.quest,min,r.date);db.sessions.push({d:r.date,kind:"focus",min})}
    bell();
    if(natural&&r.rest){db.run={...r,phase:"rest",total:r.rest*60,endAt:Date.now()+r.rest*60*1000,paused:null};save();stopSound();renderRun();afterChange("wis");return}
  }else bell();
  db.run=null;save();stopSound();lockScreen(false);renderRun();afterChange("wis");render();
}
function finishBreath(){
  const r=db.run;if(!r)return;
  const min=Math.round((r.total-left())/60);
  if(min>=1){if(r.quest)creditMinutes(r.quest,min,r.date);db.sessions.push({d:r.date,kind:"breath",min})}
  bell();db.run=null;save();lockScreen(false);lastPhase=-1;renderRun();afterChange("spi");render();
}

/* ======================= 렌더 · 내비 ======================= */
const TABS=[["today","오늘",ICON.home],["focus","집중",ICON.timer],["growth","성장",ICON.up],["log","기록",ICON.cal]];
function render(){
  $("#nav").innerHTML=TABS.map(([k,n,ic])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${svg(ic,22)}<span>${n}</span></button>`).join("");
  ({today:renderToday,focus:renderFocus,growth:renderGrowth,log:renderLog})[tab]();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-open],[data-closeov]");
  // 오버레이 닫기 (안쪽 카드를 누른 건 무시)
  if(e.target.closest("#ovroot")){
    if(e.target.closest("[data-stop]")&&!e.target.closest("button[data-closeov]"))return;
    if(e.target.closest("[data-closeov]")){$("#ovroot").onclick=null;$("#ovroot").onsubmit=null;closeOv()}
    return;
  }
  if(!b)return;
  const ds=b.dataset;
  if(ds.tab){tab=ds.tab;saveUI();openQ=null;render();scrollTo(0,0);return}
  // run view
  if(b.hasAttribute("data-rend")){db.run.kind==="focus"?finishFocus(false):finishBreath();return}
  if(b.hasAttribute("data-rpause")){const r=db.run;if(r.paused!=null){r.endAt=Date.now()+r.paused*1000;r.paused=null;if(r.kind==="focus"&&r.phase==="work")playSound(r.sound);lastPhase=-1}else{r.paused=left();stopSound()}save();renderRun();return}
  if(b.hasAttribute("data-rmute")){muted=!muted;muted?stopSound():playSound(db.run.sound);renderRun();return}
  // today
  if(ds.step){sel=addDays(sel,+ds.step);clampSel();openQ=null;render();return}
  if(ds.qtab){qtab=ds.qtab;openQ=null;render();return}
  if(b.hasAttribute("data-newq")){editQuest(null);return}
  if(ds.tog){const q=db.quests.find(x=>x.id===ds.tog);setV(sel,q.id,isDone(q,sel)?"":true);afterChange(q.stat);render();return}
  if(ds.open&&!e.target.closest("button")){openQ=openQ===ds.open?null:ds.open;render();return}
  if(ds.add){const q=db.quests.find(x=>x.id===ds.add);const cur=+((db.days[sel]||{})[q.id])||0;setV(sel,q.id,Math.round((cur+ +ds.n)*100)/100);afterChange(q.stat);render();return}
  if(ds.now){const n=new Date();setV(sel,ds.now,`${pad(n.getHours())}:${pad(n.getMinutes())}`);afterChange("dis");render();return}
  if(ds.skip){toggleSkip(sel,ds.skip);afterChange();render();return}
  if(ds.edit){editQuest(ds.edit);return}
  if(ds.timerfor){focus.quest=ds.timerfor;tab="focus";saveUI();render();scrollTo(0,0);return}
  if(ds.breathfor){tab="focus";saveUI();render();return}
  // focus
  if(ds.fmin){focus.min=ds.fmin==="c"?(focus.custom||90):+ds.fmin;saveUI();render();return}
  if(ds.fq){focus.quest=ds.fq;saveUI();render();return}
  if(ds.fs){focus.sound=ds.fs;saveUI();render();if(ds.fs!=="none"){playSound(ds.fs);setTimeout(()=>{if(!db.run)stopSound()},1800)}return}
  if(ds.frest!==undefined){focus.rest=+ds.frest;saveUI();render();return}
  if(b.hasAttribute("data-startfocus")){ac();startFocus();return}
  if(ds.bp){breath.pat=ds.bp;saveUI();render();return}
  if(ds.bmin){breath.min=+ds.bmin;saveUI();render();return}
  if(b.hasAttribute("data-startbreath")){startBreath();return}
  // growth
  if(ds.sv){statView=ds.sv;render();return}
  if(ds.ach){const a=ACH.find(x=>x.id===ds.ach);showAch(a,db.ach[a.id],false);return}
  // log
  if(ds.goto){sel=ds.goto;clampSel();tab="today";qtab="todo";saveUI();render();scrollTo(0,0);return}
  if(ds.unarch){db.quests.find(q=>q.id===ds.unarch).archived=false;save();lastAgg=compute();render();return}
  if(b.id==="copy"){const code=JSON.stringify(db);const ta=$("#backup");ta.value=code;const fb=()=>{ta.select();$("#msg").textContent="아래 칸의 코드를 직접 복사하세요."};try{navigator.clipboard.writeText(code).then(()=>{$("#msg").textContent="복사했어요."},fb)}catch(_){fb()}return}
  if(b.id==="restore"){try{const o=JSON.parse($("#backup").value);if(!o.days)throw 0;db=migrate(o);save();lastAgg=compute();checkAch(lastAgg,true);sel=today();clampSel();render();$("#msg").textContent="복원했어요."}catch(_){$("#msg").textContent="코드 형식이 맞지 않아요. 백업 코드 전체를 붙여넣었는지 확인하세요."}return}
});
let memoT;
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.hasAttribute("data-memo")){const o=dayObj(sel);if(el.value.trim())o.memo=el.value;else delete o.memo;cleanDay(sel);save();clearTimeout(memoT);memoT=setTimeout(()=>afterChange(),1500);return}
  if(el.id==="fcustom"){const n=Math.round(+el.value);if(n>=1&&n<=300){focus.min=n;focus.custom=n;saveUI()}return}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.qv){const q=db.quests.find(x=>x.id===el.dataset.qv);setV(sel,q.id,q.type==="amount"?(el.value===""?"":+el.value):el.value);afterChange(q.stat);render();return}
  if(el.id==="p-start"&&el.value){db.start=el.value;save();clampSel();lastAgg=compute();render();return}
  if(el.id==="p-total"){const n=Math.round(+el.value);if(n>=1&&n<=400){db.total=n;save();clampSel();lastAgg=compute()}render();return}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(db.run){tick();lockScreen(true)}if(tab==="today"&&sel!==today()&&!db.run){}}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{const cv=$("#herocv");if(cv){sizeCanvas(cv);const t=Math.max(0,Math.min(1,(idxOf(today())-1)/db.total));drawArt(cv,7,t<.34?"night":t<.67?"dusk":"dawn",{sx:.62,sy:.4,fs:.16,hz:.72,fx:[.78,.92]})}},200)});

render();
if(db.run){renderRun()}
</script>
