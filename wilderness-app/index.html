<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광야 수련 일지</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="광야">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9e7e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 수도원 일과표 — N칸 돌판(그리드) 위, 선택한 날의 기록지 아래 */
:root{
  --bg:#e9e7e2; --surface:#f6f5f2; --ink:#22231f; --muted:#6c6b63; --line:#d3d0c7;
  --accent:#5d6b3f; --accent-soft:#dfe3d2; --mile:#8a5a2b; --empty:#d9d6ce;
  --f-display:"Nanum Myeongjo", "Noto Serif KR", serif;
  --f-body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141512; --surface:#1d1e1a; --ink:#e7e5de; --muted:#9a988e; --line:#33352e;
  --accent:#a9bb7c; --accent-soft:#2c3320; --mile:#d39a62; --empty:#282a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141512; --surface:#1d1e1a; --ink:#e7e5de; --muted:#9a988e; --line:#33352e;
  --accent:#a9bb7c; --accent-soft:#2c3320; --mile:#d39a62; --empty:#282a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:2.2rem;margin:0;line-height:1.2}
.dayline{font-family:var(--f-display);font-size:1.15rem;color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.cell{aspect-ratio:1;max-width:100%;border:none;border-radius:4px;background:var(--empty);font:500 .68rem var(--f-mono);color:var(--muted);cursor:pointer;position:relative;padding:0}
.cell[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--empty))}
.cell[data-l="2"]{background:color-mix(in srgb,var(--accent) 60%,var(--empty));color:var(--surface)}
.cell[data-l="3"]{background:var(--accent);color:var(--surface)}
.cell.future{opacity:.45}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{box-shadow:0 0 0 3px var(--mile)}
.cell.mile::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--mile)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet h2{font-family:var(--f-display);font-size:1.3rem;margin:0}
.datepick{display:flex;align-items:center;gap:6px}
.nav{font:inherit;width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.nav:disabled{opacity:.35;cursor:default}
.badge{font-size:.72rem;color:var(--mile);font-weight:700;letter-spacing:.06em}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:none}
.item .name{font-weight:500}
.item .goal{font-size:.75rem;color:var(--muted)}
.item.met .name::before{content:"✓ ";color:var(--accent)}
input[type=number],input[type=time],input[type=date]{font:500 1rem var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=number]{width:6.5em;text-align:right}
input[type=time]{width:7.5em;text-align:right}
input[type=date]{min-width:0;max-width:11.5em}
.tog{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:5px 16px;cursor:pointer;min-width:5em}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
textarea{font:inherit;width:100%;min-height:72px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
summary{cursor:pointer;font-weight:500}
.gform{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:12px}
.btn{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.8rem;color:var(--muted)}
.future-warn{font-size:.8rem;color:var(--mile)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mile);outline-offset:2px}

html{background:var(--bg)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>광야 수련 일지</h1>
    <div class="dayline" id="dayline"></div>
  </header>

  <section class="stats" id="stats"></section>

  <section>
    <div class="grid" id="grid"></div>
    <div class="legend" style="margin-top:10px">
      <span><i style="background:var(--empty)"></i>기록 없음</span>
      <span><i style="background:color-mix(in srgb,var(--accent) 30%,var(--empty))"></i>일부</span>
      <span><i style="background:var(--accent)"></i>전부 완수</span>
      <span><i style="background:var(--mile);border-radius:50%"></i>이정표</span>
    </div>
  </section>

  <section class="sheet" id="sheet"></section>

  <details id="set-period">
    <summary>수련 기간 설정</summary>
    <div class="gform">
      <label for="p-start">시작일</label><input type="date" id="p-start">
      <label for="p-total">기간 (일)</label><input type="number" id="p-total" min="1" max="400" step="1">
    </div>
    <p class="note" style="margin-top:10px">기록은 날짜 기준으로 저장돼서, 시작일을 바꿔도 이미 쓴 기록은 그 날짜에 그대로 남아요. 기간 밖으로 밀려난 기록도 지워지지 않아요.</p>
  </details>

  <details>
    <summary>목표 기준 바꾸기</summary>
    <div class="gform" id="goals"></div>
  </details>

  <details>
    <summary>백업 · 복원</summary>
    <p class="note">기록은 이 기기에만 저장돼요. 가끔 백업 코드를 복사해서 메모장에 보관하세요.</p>
    <div class="row"><button class="btn" id="copy">백업 코드 복사</button><button class="btn" id="restore">붙여넣은 코드로 복원</button><span class="note" id="msg"></span></div>
    <textarea id="backup" placeholder="여기에 백업 코드를 붙여넣거나, 복사 버튼이 안 되면 여기서 직접 선택해 복사하세요." style="margin-top:10px"></textarea>
  </details>
</div>

<script>
const KEY="wildernessLog.v1";
const DEF_GOALS={wake:"05:30",meditate:30,bible:60,study:6};
const DEF_START="2026-10-06", DEF_TOTAL=66;

/* ---------- date helpers (로컬 날짜, 시간대 영향 없음) ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayISO=()=>iso(new Date());
const W="일월화수목금토";

/* ---------- storage + 이전 버전(일차 번호 기준) 기록 변환 ---------- */
function migrate(o){
  o.start=o.start||DEF_START; o.total=o.total||DEF_TOTAL;
  o.goals={...DEF_GOALS,...(o.goals||{})};
  const days={};
  for(const [k,v] of Object.entries(o.days||{})){
    if(/^\d+$/.test(k))days[addDays(DEF_START,+k-1)]=v;  // 예전 형식: 1일째 = 2026-10-06
    else days[k]=v;
  }
  o.days=days; return o;
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
const db=migrate(load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
save();

const dateOfIdx=i=>addDays(db.start,i-1);
const idxOf=s=>diffDays(db.start,s)+1;
const miles=()=>[...new Set([40,db.total].filter(n=>n<=db.total))];

let sel=todayISO();
function clampSel(){
  const first=db.start,last=dateOfIdx(db.total);
  if(sel<first)sel=first; if(sel>last)sel=last;
}
clampSel();

const ITEMS=[
 {k:"wake",n:"기상",type:"time",goal:g=>`${g.wake} 이전`,met:(v,g)=>v&&v<=g.wake},
 {k:"meditate",n:"명상",type:"num",unit:"분",goal:g=>`${g.meditate}분 이상`,met:(v,g)=>v!==undefined&&v!==""&&+v>=g.meditate},
 {k:"bible",n:"성경 읽기",type:"num",unit:"분",goal:g=>`${g.bible}분 이상`,met:(v,g)=>v!==undefined&&v!==""&&+v>=g.bible},
 {k:"study",n:"공부",type:"num",unit:"시간",step:.5,goal:g=>`${g.study}시간 이상`,met:(v,g)=>v!==undefined&&v!==""&&+v>=g.study},
 {k:"workout",n:"운동",type:"bool",goal:()=>"했는가",met:v=>!!v},
 {k:"diet",n:"식단",type:"bool",goal:()=>"지켰는가",met:v=>!!v}
];
function score(s){const d=db.days[s];if(!d)return 0;return ITEMS.filter(it=>it.met(d[it.k],db.goals)).length}
function level(s){const n=score(s);if(!n)return 0;if(n===ITEMS.length)return 3;return n>=ITEMS.length/2?2:1}

const $=s=>document.querySelector(s);
const fmtDot=s=>{const d=parse(s);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${W[d.getDay()]})`};

function renderHead(){
  $("#eyebrow").textContent=`광야 프로젝트 · ${db.start.replace(/-/g,".")} 시작 · ${db.total}일`;
  const t=idxOf(todayISO());
  const ms=miles();
  let line;
  if(t<1)line=`시작까지 ${1-t}일`;
  else if(t>db.total)line=`${db.total}일 기간 종료`;
  else{
    const next=ms.filter(m=>m>=t);
    line=`오늘은 ${t}일째`+next.map(m=>` · ${m}일까지 ${m-t}일`).join("");
  }
  $("#dayline").textContent=line;
  const last=Math.min(Math.max(t,0),db.total);
  let full=0,streak=0,study=0,med=0;
  for(let i=1;i<=last;i++){const s=dateOfIdx(i);if(level(s)===3)full++;const d=db.days[s]||{};study+=+d.study||0;med+=+d.meditate||0}
  for(let i=last;i>=1;i--){const s=dateOfIdx(i);if(level(s)===3)streak++;else if(i===last&&!db.days[s])continue;else break}
  $("#stats").innerHTML=[[streak,"연속 완수"],[full,"완수한 날"],[study,"누적 공부 (시간)"],[med,"누적 명상 (분)"]]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}
function renderGrid(){
  const today=todayISO(), ms=miles();let h="";
  for(let i=1;i<=db.total;i++){
    const s=dateOfIdx(i), d=parse(s);
    const cls=["cell",s>today?"future":"",s===today?"today":"",s===sel?"sel":"",ms.includes(i)?"mile":""].join(" ");
    h+=`<button class="${cls}" data-date="${s}" data-l="${level(s)}" aria-label="${i}일째 ${d.getMonth()+1}월 ${d.getDate()}일">${i}</button>`;
  }
  $("#grid").innerHTML=h;
}
function renderSheet(){
  const d=db.days[sel]||{}, i=idxOf(sel);
  const first=db.start,last=dateOfIdx(db.total);
  let h=`<div class="sheet-head"><h2>${i}일째 ${miles().includes(i)?'<span class="badge">이정표</span>':""}</h2>
    <div class="datepick">
      <button class="nav" data-step="-1" ${sel<=first?"disabled":""} aria-label="전날">‹</button>
      <input type="date" id="f-date" value="${sel}" min="${first}" max="${last}" aria-label="기록할 날짜">
      <button class="nav" data-step="1" ${sel>=last?"disabled":""} aria-label="다음날">›</button>
    </div></div>
    <div class="note">${fmtDot(sel)}</div>`;
  if(sel>todayISO())h+=`<div class="future-warn">아직 오지 않은 날이에요. 미리 계획을 적어둘 수 있어요.</div>`;
  for(const it of ITEMS){
    const v=d[it.k], met=it.met(v,db.goals);
    let ctl;
    if(it.type==="bool")ctl=`<button class="tog" data-k="${it.k}" aria-pressed="${!!v}">${v?"완료":"미완"}</button>`;
    else if(it.type==="time")ctl=`<input type="time" id="f-${it.k}" data-k="${it.k}" value="${v||""}">`;
    else ctl=`<span class="row"><input type="number" id="f-${it.k}" data-k="${it.k}" min="0" step="${it.step||5}" value="${v??""}" inputmode="decimal"><span class="note">${it.unit}</span></span>`;
    h+=`<div class="item ${met?"met":""}"><div><div class="name">${it.n}</div><div class="goal">목표: ${it.goal(db.goals)}</div></div>${ctl}</div>`;
  }
  h+=`<label for="f-memo" class="note">오늘의 묵상 · 메모</label><textarea id="f-memo" data-k="memo" placeholder="오늘 붙잡은 말씀, 흔들린 순간, 내일 고칠 것">${(d.memo||"").replace(/</g,"&lt;")}</textarea>`;
  $("#sheet").innerHTML=h;
}
function renderPeriod(){$("#p-start").value=db.start;$("#p-total").value=db.total}
function renderGoals(){
  const g=db.goals;
  $("#goals").innerHTML=`<label for="g-wake">기상 목표 시각</label><input type="time" id="g-wake" data-g="wake" value="${g.wake}">
  <label for="g-meditate">명상 (분)</label><input type="number" id="g-meditate" data-g="meditate" min="0" step="5" value="${g.meditate}">
  <label for="g-bible">성경 읽기 (분)</label><input type="number" id="g-bible" data-g="bible" min="0" step="5" value="${g.bible}">
  <label for="g-study">공부 (시간)</label><input type="number" id="g-study" data-g="study" min="0" step=".5" value="${g.study}">`;
}
function refresh(){renderHead();renderGrid()}
function renderAll(){renderHead();renderGrid();renderSheet();renderPeriod();renderGoals()}
function setVal(k,v){const d=db.days[sel]||(db.days[sel]={});if(v===""||v==null||v===false)delete d[k];else d[k]=v;if(!Object.keys(d).length)delete db.days[sel];save()}
function goTo(s){sel=s;clampSel();renderGrid();renderSheet()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.date){goTo(b.dataset.date);return}
  if(b.dataset.step){goTo(addDays(sel,+b.dataset.step));return}
  if(b.classList.contains("tog")){const k=b.dataset.k;const cur=(db.days[sel]||{})[k];setVal(k,cur?"":true);renderSheet();refresh();return}
  if(b.id==="copy"){const code=JSON.stringify(db);const ta=$("#backup");ta.value=code;
    const fallback=()=>{ta.select();$("#msg").textContent="아래 칸의 코드를 직접 복사하세요."};
    try{navigator.clipboard.writeText(code).then(()=>{$("#msg").textContent="복사했어요."},fallback)}catch(_){fallback()}
    return}
  if(b.id==="restore"){try{const o=JSON.parse($("#backup").value);if(!o.days)throw 0;Object.assign(db,migrate(o));save();sel=todayISO();clampSel();renderAll();$("#msg").textContent="복원했어요."}catch(_){$("#msg").textContent="코드 형식이 맞지 않아요. 백업 코드 전체를 붙여넣었는지 확인하세요."}}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.k){setVal(el.dataset.k,el.type==="number"?(el.value===""?"":+el.value):el.value);
    if(el.dataset.k!=="memo"){const it=ITEMS.find(x=>x.k===el.dataset.k);el.closest(".item").classList.toggle("met",!!it.met(el.value,db.goals))}
    refresh()}
  if(el.dataset.g){db.goals[el.dataset.g]=el.type==="number"?+el.value:el.value;save();renderSheet();refresh()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="f-date"&&el.value){goTo(el.value);return}
  if(el.id==="p-start"&&el.value){db.start=el.value;save();clampSel();renderAll();return}
  if(el.id==="p-total"){const n=Math.round(+el.value);if(n>=1&&n<=400){db.total=n;save();clampSel();renderAll()}else renderPeriod()}
});
renderAll();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
